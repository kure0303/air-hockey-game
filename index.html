<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Air Hockey Game</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #2c3e50;
            font-family: Arial, sans-serif;
            color: white;
            overflow-x: hidden;
        }

        #gameContainer {
            position: relative;
            margin: 20px auto;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas {
            background-color: #000;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.3);
        }

        .screen {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: rgba(0, 0, 0, 0.85);
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            color: white;
            min-width: 60%;
            z-index: 100;
        }

        .hidden {
            display: none !important;
        }

        button {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin: 10px;
            font-size: 1em;
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: #2980b9;
        }

        .score-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 20px;
            font-size: 24px;
            font-weight: bold;
        }

        .match-info {
            font-size: 18px;
            margin-bottom: 10px;
            text-align: center;
        }

        #upgradeScreen {
            width: 80%;
            max-width: 600px;
        }

        .upgrade-choices {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        .upgrade-choice {
            background-color: #34495e;
            padding: 15px;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .upgrade-choice:hover {
            transform: scale(1.05);
            box-shadow: 0 0 15px rgba(52, 152, 219, 0.3);
        }

        .upgrade-choice h3 {
            margin: 0 0 10px 0;
            color: #3498db;
        }

        .upgrade-choice p {
            margin: 0;
            font-size: 14px;
        }

        .rarity-rare {
            background: linear-gradient(135deg, #34495e, #8e44ad);
            border: 2px solid #8e44ad;
        }

        .rarity-rare h3 {
            color: #f1c40f;
        }

        #gameOverScreen {
            text-align: center;
        }

        #winnerMessage {
            font-size: 24px;
            margin: 20px 0;
            color: #f1c40f;
        }

        #finalScore {
            font-size: 36px;
            margin: 20px 0;
            color: #3498db;
        }

        .error-message {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: #e74c3c;
            color: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            z-index: 1000;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
        }

        @media (max-width: 768px) {
            body {
                padding: 10px;
            }

            .screen {
                width: 90%;
                padding: 15px;
            }

            .upgrade-choices {
                grid-template-columns: 1fr;
            }

            button {
                padding: 8px 16px;
                font-size: 0.9em;
            }
        }
    </style>
</head>

<body>
    <div class="score-container">
        <div>AI: <span id="player1Score">0</span></div>
        <div>Player: <span id="player2Score">0</span></div>
    </div>
    <div class="match-info">
        Match: <span id="currentMatch">1</span>/3
    </div>
    <div id="gameContainer">
        <canvas id="gameCanvas"></canvas>

        <div id="startScreen" class="screen">
            <h2>エアホッケー</h2>
            <button id="startButton">ゲーム開始</button>
        </div>

        <div id="pauseScreen" class="screen hidden">
            <h2>一時停止</h2>
            <button id="resumeButton">再開</button>
            <button id="restartButton">リスタート</button>
        </div>

        <div id="upgradeScreen" class="screen hidden">
            <h2>アップグレードを選択</h2>
            <div>
                前回のスコア: <span id="lastMatchScore">0 - 0</span><br>
                現在の合計: <span id="totalScore">0 - 0</span>
            </div>
            <div class="upgrade-choices">
                <!-- アップグレード選択肢がここに動的に追加されます -->
            </div>
        </div>

        <div id="gameOverScreen" class="screen hidden">
            <h2>ゲーム終了</h2>
            <div id="winnerMessage"></div>
            <div id="finalScore"></div>
            <button id="playAgainButton">もう一度プレイ</button>
        </div>
    </div>

    <script src="upgrades.js"></script>
    <script src="effects.js"></script>
    <script src="game.js"></script>
</body>

</html>
