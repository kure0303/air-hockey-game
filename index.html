<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Air Hockey Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            position: fixed;
            background-color: #2c3e50;
            font-family: Arial, sans-serif;
            color: white;
        }

        body {
            display: flex;
            flex-direction: column;
            padding: 10px;
        }

        .header {
            flex: 0 0 auto;
            width: 100%;
            text-align: center;
            margin-bottom: 10px;
        }

        #gameContainer {
            flex: 1 1 auto;
            position: relative;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 0;
        }

        canvas {
            background-color: #000;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.3);
            will-change: transform;
            transform: translateZ(0);
            backface-visibility: hidden;
        }

        .score-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .match-info {
            font-size: 18px;
            margin-bottom: 5px;
        }

        .screen {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: rgba(0, 0, 0, 0.9);
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            width: 80%;
            max-width: 400px;
            z-index: 100;
            transition: opacity 0.3s ease-out;
            will-change: opacity;
        }

        .hidden {
            display: none !important;
            opacity: 0;
            pointer-events: none;
        }

        button {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin: 10px;
            font-size: 16px;
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: #2980b9;
        }

        .upgrade-choices {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
            margin-top: 20px;
            max-height: 60vh;
            overflow-y: auto;
        }

        .upgrade-choice {
            background-color: #34495e;
            padding: 15px;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.2s;
            position: relative;
            overflow: hidden;
            will-change: transform;
            transform: translateZ(0);
        }

        .upgrade-choice:hover {
            transform: scale(1.05);
        }

        .upgrade-choice h3 {
            color: #3498db;
            margin: 0 0 10px 0;
            font-size: 1.2em;
        }

        .upgrade-choice p {
            margin: 0 0 10px 0;
            font-size: 0.9em;
            line-height: 1.4;
        }

        .effect-details {
            background-color: rgba(0, 0, 0, 0.2);
            padding: 8px;
            border-radius: 4px;
            margin-top: 10px;
            font-size: 0.85em;
            color: #ecf0f1;
        }

        .upgrade-type {
            position: absolute;
            top: 10px;
            right: 10px;
            background-color: rgba(0, 0, 0, 0.3);
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.8em;
            color: #f1c40f;
        }

        .effect-preview {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 4px;
            transition: height 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            will-change: height;
        }

        .upgrade-choice:hover .effect-preview {
            height: 8px;
        }

        .rarity-rare {
            background: linear-gradient(135deg, #34495e, #8e44ad);
            border: 2px solid #8e44ad;
        }

        .rarity-rare h3 {
            color: #f1c40f;
            text-shadow: 0 0 5px rgba(241, 196, 15, 0.5);
        }

        .rarity-common {
            border: 1px solid #3498db;
        }

        .error-message {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background-color: #e74c3c;
            color: white;
            padding: 15px 30px;
            border-radius: 8px;
            text-align: center;
            z-index: 1000;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            animation: slideIn 0.3s ease-out;
            font-size: 16px;
            max-width: 90%;
        }

        .error-message.fade-out {
            animation: fadeOut 0.5s ease-out forwards;
        }

        @keyframes slideIn {
            from {
                transform: translate(-50%, -100%);
                opacity: 0;
            }

            to {
                transform: translate(-50%, 0);
                opacity: 1;
            }
        }

        @keyframes fadeOut {
            from {
                opacity: 1;
                transform: translate(-50%, 0);
            }

            to {
                opacity: 0;
                transform: translate(-50%, -20px);
            }
        }

        @media (max-width: 768px) {
            body {
                padding: 5px;
            }

            .score-container {
                font-size: 18px;
                margin-bottom: 3px;
            }

            .match-info {
                font-size: 16px;
                margin-bottom: 3px;
            }

            .screen {
                width: 90%;
                padding: 15px;
            }

            button {
                padding: 8px 16px;
                font-size: 14px;
                margin: 5px;
            }

            .upgrade-choices {
                grid-template-columns: 1fr;
            }

            .upgrade-choice h3 {
                font-size: 1.1em;
            }

            .upgrade-choice p {
                font-size: 0.85em;
            }

            .effect-details {
                font-size: 0.8em;
            }
        }

        @media (max-height: 600px) {
            .score-container {
                font-size: 16px;
                margin-bottom: 2px;
            }

            .match-info {
                font-size: 14px;
                margin-bottom: 2px;
            }

            .screen {
                padding: 10px;
            }

            .upgrade-choices {
                max-height: 50vh;
            }
        }

        @media (hover: none) {
            .upgrade-choice:active {
                transform: scale(0.98);
            }

            .effect-preview {
                height: 6px;
            }
        }
    </style>
</head>

<body>
    <div class="header">
        <div class="score-container">
            <div>AI: <span id="player1Score">0</span></div>
            <div>Player: <span id="player2Score">0</span></div>
        </div>
        <div class="match-info">
            Match: <span id="currentMatch">1</span>/3
        </div>
    </div>
    <div id="gameContainer">
        <canvas id="gameCanvas"></canvas>

        <div id="startScreen" class="screen">
            <h2>エアホッケー</h2>
            <button id="startButton">ゲーム開始</button>
        </div>

        <div id="pauseScreen" class="screen hidden">
            <h2>一時停止</h2>
            <button id="resumeButton">再開</button>
            <button id="restartButton">リスタート</button>
        </div>

        <div id="upgradeScreen" class="screen hidden">
            <h2>アップグレードを選択</h2>
            <div>
                前回のスコア: <span id="lastMatchScore">0 - 0</span><br>
                現在の合計: <span id="totalScore">0 - 0</span>
            </div>
            <div class="upgrade-choices">
                <!-- アップグレード選択肢がここに動的に追加されます -->
            </div>
        </div>

        <div id="gameOverScreen" class="screen hidden">
            <h2>ゲーム終了</h2>
            <div id="winnerMessage"></div>
            <div id="finalScore"></div>
            <button id="playAgainButton">もう一度プレイ</button>
        </div>
    </div>

    <script src="upgrades.js"></script>
    <script src="effects.js"></script>
    <script src="game.js"></script>
</body>

</html>
